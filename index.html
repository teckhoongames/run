.thumbs button img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.72; transition: opacity 0.15s; }
.thumbs button:hover img, .thumbs button[aria-current="true"] img { opacity: 1; }
.thumbs button[aria-current="true"] { border-color: var(--pink); }

.info { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }

      ['製品版で追加予定', ['7週目から24週目まで続く本編と、9月の全国大会予選の結末まで描かれます。', 'お隣さん・スンヨンの物語が本格的に始まります。スンヨンにも好感度などさまざまなステータスが加わります。', 'スンヨンともAIメッセージで直接会話できます。', '新しいCGが多数追加されます。', 'さまざまな表情の立ち絵が追加されます。', 'エンディングがさらに多彩になります。', 'AIチャットでのチェアの表情や姿がもっと豊かになります。', 'そのほかにも、さまざまな機能や画像が順次アップデートされます。'], '05-beach-cg.png'],
      ['体験版について', ['プロローグから6週目までの一部をプレイできます。', '한국어、English、日本語、简体中文、繁體中文に対応しています。', '体験版は開発途中のバージョンのため、最終的な完成度とは異なる場合があります。収録範囲は全体の約8〜10%です。', '演出・CG・イラストなどの細かな部分は、開発の過程で変わることがあります。']],

};
const SHOTS = ['01-store-choice.png', '02-week-chat.png', '03-free-play.png', '04-track-cg.png', '05-beach-cg.png', '06-prologue-nvl.png'];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const page = document.getElementById('page'), langBox = document.getElementById('langs');
let lang = 'ko';
try { const h = location.hash.slice(1); if (L[h]) lang = h; else { const s = localStorage.getItem('run-site-lang'); if (L[s]) lang = s; else { const n = (navigator.language || '').toLowerCase(); lang = n.startsWith('ja') ? 'ja' : n.startsWith('zh') ? (/tw|hk|mo|hant/.test(n) ? 'zh-Hant' : 'zh-Hans') : n.startsWith('ko') ? 'ko' : n ? 'en' : 'ko'; } } } catch {}

function render() {
  const T = L[lang], img = (f) => (f === 'key' ? 'key.png' : `${lang}_${f}`);
  document.documentElement.lang = lang; document.title = T.title;
  langBox.innerHTML = ORDER.map((k) => `<button type="button" data-l="${k}" aria-pressed="${k === lang}" lang="${k}">${esc(L[k].name)}</button>`).join('');
  const fig = (f) => `<figure class="shot"><img src="${img(f)}" alt="" loading="lazy"><figcaption>${esc(T.caps[f])}</figcaption></figure>`;
  const N = NOTICE[lang];
  page.innerHTML = `
  <div class="notice" role="status"><span class="demo">${esc(N.demo)}</span><p>${esc(N.ai)}<small>${esc(N.eta)}</small></p></div>
  <section class="top">
    <div>
      <figure class="viewer" style="margin:0"><img id="main" alt=""><figcaption id="cap"></figcaption></figure>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <aside class="info">
      <div class="key"><img src="key.png" alt="${esc(T.caps.key)}"></div>
      <p class="lead">${esc(T.lead)}</p>
      <dl>${T.info.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>
      <div class="tags">${T.tags.map((x) => `<span>${esc(x)}</span>`).join('')}</div>
      <a class="cta" href="https://store.onstove.com/" target="_blank" rel="noopener noreferrer">${esc(T.cta)}<small>${esc(T.ctaSub)}</small></a>
    </aside>
  </section>
  <section class="body">
    <article class="desc">
      <p class="quote">${esc(T.quote)}</p>
      <p>${T.intro.map(esc).join('<br>')}</p>
      ${fig('06-prologue-nvl.png')}
      <h2>${esc(T.featH)}</h2>
      <ul class="feat">${T.feat.map(([a, b]) => `<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ul>
      ${fig('01-store-choice.png')}
      ${T.sec.map(([h, items, shot], i) => `<h2>${esc(h)}</h2><ul>${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>${shot ? fig(shot) : ''}${i === 2 ? `<figure class="shot"><img src="${img('07-expressions.png')}" alt="${esc(T.exprC)}" loading="lazy"><figcaption>${esc(T.exprC)}</figcaption></figure>` : ''}`).join('')}
    </article>
    <aside class="side">
      <div class="box">
        <h3>${esc(T.charH)}</h3>
        <dl class="spec">
          <dt class="hand">${esc(T.chaea)}</dt><dd>${esc(T.chaeaD)}<br><span class="note">CV. ${lang === 'ja' ? 'ダルビ' : lang === 'ko' ? '달비' : 'Dalbi'} · ${esc(T.exprC)}</span></dd>
          <dt class="hand" style="color:var(--green)">${esc(T.side)}</dt><dd>${esc(T.sideD)}<br><span class="note">CV. Hyun · ${esc(T.exprS)}</span></dd>
        </dl>
        <p class="note" style="margin:10px 0 0">${esc(T.cvNote)}</p>
      </div>
      <div class="box">
        <h3>${esc(T.langH)}</h3>
        <div style="overflow-x:auto"><table class="langs">
          <thead><tr>${T.lcols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>${ORDER.map((k) => `<tr><td lang="${k}">${esc(L[k].name)}</td><td class="y">✓</td><td class="y">${k === 'ko' ? '✓' : ''}</td><td class="y">✓</td></tr>`).join('')}</tbody>
        </table></div>
      </div>
      <div class="box">
        <h3>${esc(T.specH)}</h3>
        <dl class="spec">${T.spec.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>

    </aside>
  </section>
  <section class="box sg" aria-labelledby="sg-h"><h3 id="sg-h">${esc(T.sg.h)}</h3><p class="note" style="margin:0 0 10px">${esc(T.sg.p)}</p><form id="sg-form" action="https://docs.google.com/forms/d/e/1FAIpQLSfQh5cRY9vDxssgoOFTt6E1CEpqs1Rj7jQlnhXB4MF00UI1Sg/formResponse" method="POST" target="gf-sink"><label for="sg-text" class="sr">${esc(T.sg.h)}</label><textarea id="sg-text" maxlength="1000" rows="4" placeholder="${esc(T.sg.ph)}"></textarea><input type="hidden" name="entry.1744762176" id="sg-val"><div class="sg-row"><span class="note" id="sg-msg" role="status"></span><button type="submit" id="sg-send">${esc(T.sg.send)}</button></div></form><iframe name="gf-sink" id="gf-sink" title="-" hidden></iframe></section>
  <footer>© Teckhoon Games</footer>`;
  const main = document.getElementById('main'), cap = document.getElementById('cap'), thumbs = document.getElementById('thumbs');
  const all = [...SHOTS, 'key'];
  const show = (i) => { main.src = img(all[i]); main.alt = T.caps[all[i]]; cap.textContent = T.caps[all[i]]; [...thumbs.children].forEach((b, k) => b.setAttribute('aria-current', String(k === i))); };
  all.forEach((f, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', T.caps[f]); b.innerHTML = `<img src="${img(f)}" alt="" loading="lazy">`; b.onclick = () => show(i); thumbs.append(b); });
  show(0);

}
// 건의사항: 우리 칸에서 쓰고, 보낼 때만 구글 폼(응답은 제작자 구글 계정에서만 보임)으로 넘김. 글 앞에 [언어]
let lastAt = 0;
function setupSuggest(S) {
  const form = document.getElementById('sg-form'), text = document.getElementById('sg-text'), val = document.getElementById('sg-val'), send = document.getElementById('sg-send'), msg = document.getElementById('sg-msg'), sink = document.getElementById('gf-sink');
  let waiting = false;
  sink.addEventListener('load', () => { if (!waiting) return; waiting = false; text.value = ''; msg.textContent = S.ok; send.disabled = false; });
  form.addEventListener('submit', (e) => {
    const t = text.value.trim();
    if (!t) { e.preventDefault(); msg.textContent = S.empty; return; }
    if (Date.now() - lastAt < 30000) { e.preventDefault(); msg.textContent = S.wait; return; }
    lastAt = Date.now(); waiting = true; send.disabled = true; msg.textContent = S.sending;
    val.value = '[' + lang + '] ' + t.slice(0, 1000);
    setTimeout(() => { if (waiting) { waiting = false; send.disabled = false; msg.textContent = S.fail; } }, 15000);
  });
}
langBox.addEventListener('click', (e) => { const b = e.target.closest('[data-l]'); if (!b || b.dataset.l === lang) return; lang = b.dataset.l; try { localStorage.setItem('run-site-lang', lang); } catch {} try { history.replaceState(null, '', '#' + lang); } catch {} render(); window.scrollTo(0, 0); });

render();
</script>
